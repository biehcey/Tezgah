<!doctype html>
<!--
  PROTOTİP — atılabilir. Ticket: .scratch/ilk-dilim/issues/23-script-ekrani-yerlesimi.md
  Script çalıştırma ekranının üç yerleşim varyantı, ?variant=A|B|C ile değiştirilir.
  Senaryo ?senaryo=..., hedef ?hedef=dev|prod. Alttaki çubukta ← → ile varyant, açılır listeyle senaryo.
  Hiçbir şey çalışmaz; tüm durum sabit senaryolardan gelir.
-->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Script ekranı prototipi</title>
<style>
  :root {
    --bg:#1e1f22; --panel:#2b2d30; --panel2:#25272a; --line:#393b40; --fg:#dfe1e5; --dim:#8c8f94;
    --ok:#5fb865; --err:#f75464; --warn:#e5a33a; --run:#4a9eff; --prod:#e5484d; --add:#2f4a32; --del:#4a2a2d; --chg:#4a4024;
    --kw:#cf8e6d; --str:#6aab73; --cm:#7a7e85;
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); height:100vh; overflow:hidden; }
  button { font:inherit; color:var(--fg); background:#3c3f44; border:1px solid #4e5157; border-radius:4px; padding:3px 10px; cursor:pointer; }
  button.primary { background:#3574f0; border-color:#3574f0; }
  button.danger { background:#a8323a; border-color:#a8323a; }
  button.ghost { background:none; border-color:transparent; color:var(--dim); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  input[type=text] { font:inherit; background:#1e1f22; color:var(--fg); border:1px solid #4e5157; border-radius:4px; padding:3px 6px; }
  a { color:#6ea8fe; text-decoration:none; } a:hover { text-decoration:underline; }
  .mono { font-family: "JetBrains Mono", Consolas, monospace; font-size:12.5px; }
  .dim { color:var(--dim); }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11.5px; font-weight:600; border:1px solid; }
  .badge.tx { color:#6ea8fe; border-color:#3a5f9a; background:#1f2b3d; }
  .badge.ac { color:#f0a53a; border-color:#8a5e1d; background:#3a2b14; }
  .badge.mix { color:var(--err); border-color:#8a2f37; background:#3a1d20; }
  .badge.env { color:#fff; border:none; }
  .app { height:100vh; display:flex; flex-direction:column; }
  .app.prod { box-shadow: inset 0 0 0 3px var(--prod); }
  .strip { padding:6px 12px; font-size:12.5px; display:flex; gap:10px; align-items:center; }
  .strip.deneme { background:#3a2b14; color:#f3c27a; border-bottom:1px solid #8a5e1d; }
  .strip.prodlock { background:#3a1d20; color:#ffb3b8; border-bottom:1px solid #8a2f37; }
  .strip.err { background:#3a1d20; color:#ffb3b8; }
  .strip.info { background:#1f2b3d; color:#b8d4ff; }

  /* editör */
  .editor { flex:1; overflow:auto; background:var(--bg); padding:6px 0; position:relative; }
  .ln { display:flex; min-height:19px; }
  .ln .g { width:22px; text-align:center; flex:none; }
  .ln .n { width:34px; text-align:right; padding-right:10px; color:#4e5157; flex:none; user-select:none; }
  .ln .c { white-space:pre; flex:1; }
  .ln.errline { background:#4a1f24; }
  .ln.errline .c { text-decoration: wavy underline var(--err); text-underline-offset:3px; }
  .ln.running { background:#1d2a3f; }
  .ln.nontx { background:#3a2b14; }
  .ln.done .c { opacity:.85; }
  .kw { color:var(--kw); } .str { color:var(--str); } .cm { color:var(--cm); font-style:italic; }
  .gi { font-size:11px; }
  .inlinewidget { margin:2px 0 4px 56px; padding:3px 8px; border-left:2px solid var(--line); font-size:12px; color:var(--dim); }
  .inlinewidget.e { border-color:var(--err); color:#ffb3b8; background:#2e1a1d; }
  .inlinewidget.o { border-color:var(--ok); }
  .inlinewidget.r { border-color:var(--run); color:#b8d4ff; }
  .inlinewidget.w { border-color:var(--warn); color:#f3c27a; }

  /* log */
  .log { font-size:12.5px; }
  .log .row { display:grid; grid-template-columns: 20px 50px 1fr auto auto; gap:8px; padding:4px 10px; border-bottom:1px solid #303236; align-items:baseline; }
  .log .row.err { background:#2e1a1d; }
  .log .row.cur { background:#1d2a3f; }
  .log .row.skip { color:var(--dim); }
  .log .msg { grid-column: 3 / -1; color:#ffb3b8; font-size:12px; }
  .preview { grid-column: 3 / -1; }
  table.p { border-collapse:collapse; font-size:12px; margin:4px 0; }
  table.p td, table.p th { border:1px solid #3a3d42; padding:1px 8px; text-align:left; }
  table.p th { background:#2e3034; font-weight:600; }
  tr.add td { background:var(--add); } tr.del td { background:var(--del); text-decoration:line-through; }
  td.chg { background:var(--chg); } s { color:var(--dim); }

  .tabs { display:flex; gap:2px; border-bottom:1px solid var(--line); padding:0 8px; background:var(--panel2); }
  .tabs div { padding:5px 10px; cursor:pointer; color:var(--dim); border-bottom:2px solid transparent; }
  .tabs div.on { color:var(--fg); border-color:#3574f0; }
  .count { font-variant-numeric: tabular-nums; }
  .countdown { color:var(--warn); font-weight:700; }

  .targetsel { display:inline-flex; align-items:center; gap:6px; background:#1e1f22; border:1px solid #4e5157; border-radius:4px; padding:2px 8px; cursor:pointer; }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; }

  /* modal */
  .modalbg { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:50; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:8px; width:min(520px, 92vw); padding:16px 18px; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .modal.prod { border:2px solid var(--prod); }
  .modal h3 { margin:0 0 8px; font-size:15px; }
  .modal ul { margin:6px 0 10px; padding-left:18px; }
  .modal .act { display:flex; justify-content:flex-end; gap:8px; margin-top:12px; }

  /* switcher */
  .sw { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:#fff; color:#111; border-radius:999px; padding:5px 8px; display:flex; gap:8px; align-items:center; box-shadow:0 6px 24px rgba(0,0,0,.6); z-index:100; font-size:12.5px; }
  .sw button { background:#111; color:#fff; border:none; border-radius:999px; padding:3px 10px; }
  .sw select { font:inherit; border-radius:6px; }
  .sw label { display:flex; gap:4px; align-items:center; }
  .note { position:fixed; top:8px; right:10px; font-size:11px; color:#666; z-index:99; }
</style>
</head>
<body>
<div id="root"></div>
<div class="sw" id="sw"></div>
<script>
// ---------- veri ----------
const SCRIPT_TX = [
  "-- eski müşterileri pasife al",
  "UPDATE musteri SET durum = 'pasif'",
  "WHERE son_giris < now() - interval '2 years';",
  "",
  "INSERT INTO denetim_notu (tablo, not_metni)",
  "VALUES ('musteri', 'eski hesaplar pasife alındı');",
  "",
  "DELETE FROM oturum WHERE musteri_no IN (",
  "  SELECT id FROM musteri WHERE durum = 'pasif'",
  ");",
  "",
  "SELECT durum, count(*) FROM musteri GROUP BY durum;",
];
const STMTS_TX = [
  { from:2, to:3, tag:"UPDATE", rows:"UPDATE 1 284", ms:142 },
  { from:5, to:6, tag:"INSERT", rows:"INSERT 0 1", ms:3 },
  { from:8, to:10, tag:"DELETE", rows:"DELETE 3 911", ms:88 },
  { from:12, to:12, tag:"SELECT", rows:"2 satır", ms:12, preview:[["durum","count"],["aktif","20 117"],["pasif","1 284"]] },
];
const SCRIPT_AC = [
  "VACUUM ANALYZE musteri;",
  "CREATE INDEX CONCURRENTLY idx_oturum_musteri",
  "  ON oturum (musteri_id);",
];
const STMTS_AC = [
  { from:1, to:1, tag:"VACUUM", rows:"VACUUM", ms:4210 },
  { from:2, to:3, tag:"CREATE INDEX", rows:"CREATE INDEX", ms:18930 },
];
const SCRIPT_MIX = SCRIPT_TX.slice(0, 7).concat(["CREATE INDEX CONCURRENTLY idx_x ON oturum (musteri_id);"]);
const STMTS_MIX = [STMTS_TX[0], STMTS_TX[1], { from:8, to:8, tag:"CREATE INDEX", nontx:true }];

// faz: bos | calisiyor | karar | gerisayim | suredoldu | hata | commit | ac-onay | ac-calisiyor | ac-bitti | karisik | deneme | deneme-hata | prod-onay
const SCENARIOS = {
  "bos":          { label:"Boş (çalıştırmaya hazır)", script:"tx", phase:"bos", st:[] },
  "calisiyor":    { label:"Çalışıyor (3. ifade)", script:"tx", phase:"calisiyor", st:["ok","ok","run","wait"] },
  "karar":        { label:"Bitti, commit/rollback bekliyor", script:"tx", phase:"karar", st:["ok","ok","ok","ok"] },
  "gerisayim":    { label:"Karar süresi: son 1 dk", script:"tx", phase:"gerisayim", st:["ok","ok","ok","ok"] },
  "suredoldu":    { label:"Karar süresi doldu → rollback", script:"tx", phase:"suredoldu", st:["ok","ok","ok","ok"] },
  "hata":         { label:"Hata (3. ifade), karar bekliyor", script:"tx", phase:"hata", st:["ok","ok","err","skip"] },
  "commit":       { label:"Commit edildi", script:"tx", phase:"commit", st:["ok","ok","ok","ok"] },
  "karisik":      { label:"Karışık script (çalıştırılamaz)", script:"mix", phase:"karisik", st:[] },
  "ac-onay":      { label:"Autocommit: hazır (onay yok, uyarı şeridi)", script:"ac", phase:"bos", st:[] },
  "ac-bitti":     { label:"Autocommit: hata sonrası özet", script:"ac", phase:"ac-bitti", st:["ok","err"] },
  "deneme":       { label:"Deneme modu: bitti (rollback)", script:"tx", phase:"deneme", st:["ok","ok","ok","ok"] },
  "deneme-hata":  { label:"Deneme modu: hata", script:"tx", phase:"deneme-hata", st:["ok","ok","err","skip"] },
  "prod-kilitli": { label:"prod: salt okunur (yazma kilidi kapalı)", script:"tx", phase:"bos", st:[], forceProd:true, lock:"kapali" },
  "prod-onay":    { label:"prod: yazma açık", script:"tx", phase:"bos", st:[], forceProd:true, lock:"acik" },
};
const ERR = { line:8, col:27, code:"42703", msg:'column "musteri_no" does not exist' };
const TARGETS = {
  dev:  { conn:"Müşteri DB (dev)", db:"crm", env:"dev", color:"#3f8f4a" },
  prod: { conn:"Müşteri DB (prod)", db:"crm", env:"prod", color:"#e5484d" },
};

// ---------- durum ----------
const q = new URLSearchParams(location.search);
const VARIANTS = { A:"IDE: alt panel + sekmeler", B:"Sağ sütun: ifade zaman çizelgesi", C:"Satır içi: log editörün içinde" };
let variant = VARIANTS[q.get("variant")] ? q.get("variant") : "A";
let scenarioKey = SCENARIOS[q.get("senaryo")] ? q.get("senaryo") : "karar";
let hedef = q.get("hedef") === "prod" ? "prod" : "dev";
let tab = null; // seçilen alt sekme
let typed = "";

function setUrl() {
  const u = new URL(location); u.searchParams.set("variant", variant); u.searchParams.set("senaryo", scenarioKey); u.searchParams.set("hedef", hedef);
  history.replaceState(null, "", u);
}
function S() {
  const s = SCENARIOS[scenarioKey];
  const kind = s.script;
  const t = TARGETS[s.forceProd ? "prod" : hedef];
  const isProd = t.env === "prod";
  return {
    ...s, t, isProd,
    lines: kind === "ac" ? SCRIPT_AC : kind === "mix" ? SCRIPT_MIX : SCRIPT_TX,
    stmts: kind === "ac" ? STMTS_AC : kind === "mix" ? STMTS_MIX : STMTS_TX,
    mode: kind === "ac" ? "Autocommit" : kind === "mix" ? "Karışık" : "Transaction",
    deneme: s.phase.startsWith("deneme"),
    lock: s.lock || (isProd ? "kapali" : null),
    karar: isProd ? "5 dk" : "30 dk",
  };
}

// ---------- ortak parçalar ----------
function hl(line) {
  if (line.trim().startsWith("--")) return `<span class="cm">${esc(line)}</span>`;
  return esc(line)
    .replace(/('[^']*')/g, '<span class="str">$1</span>')
    .replace(/\b(UPDATE|SET|WHERE|INSERT|INTO|VALUES|DELETE|FROM|IN|SELECT|GROUP|BY|VACUUM|ANALYZE|CREATE|INDEX|CONCURRENTLY|ON|interval|now)\b/g, '<span class="kw">$1</span>');
}
function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function stmtOfLine(s, n) { return s.stmts.findIndex(x => n >= x.from && n <= x.to); }
const ICON = { ok:'<span style="color:var(--ok)">✓</span>', err:'<span style="color:var(--err)">✗</span>', run:'<span style="color:var(--run)">●</span>', wait:'<span class="dim">○</span>', skip:'<span class="dim">–</span>' };

function modeBadge(s) {
  if (s.mode === "Autocommit") return `<span class="badge ac" title="Script yalnızca transaction dışı komutlardan oluşuyor; her ifade anında kalıcı">Autocommit</span>`;
  if (s.mode === "Karışık") return `<span class="badge mix" title="Transaction dışı komutlar diğerleriyle karışık">Karışık — çalıştırılamaz</span>`;
  return `<span class="badge tx">Transaction</span>`;
}
function targetSel(s) {
  return `<span class="targetsel" title="Hedef: bağlantı + veritabanı"><span class="dot" style="background:${s.t.color}"></span>${s.t.conn} <span class="dim">/</span> ${s.t.db} <span class="badge env" style="background:${s.t.color}">${s.t.env}</span> ▾</span>`;
}
function lockCtl(s) {
  if (!s.isProd) return "";
  return s.lock === "acik"
    ? `<span class="badge mix" title="Yalnızca bu editör/hedef, oturum boyunca">🔓 Yazma açık</span> <button class="ghost" onclick="go('prod-kilitli')">kilitle</button>`
    : `<span class="badge" style="color:#ffb3b8;border-color:#8a2f37">🔒 Salt okunur</span> <button onclick="go('prod-onay')">Yazma modunu aç</button>`;
}
function runButtons(s, compact) {
  const busy = ["calisiyor","karar","gerisayim","hata",].includes(s.phase);
  const mix = s.mode === "Karışık";
  const runDisabled = busy || mix || (s.isProd && s.lock !== "acik");
  const tryDisabled = busy || mix || s.mode === "Autocommit";
  const runTitle = mix ? "Transaction dışı ifadeleri ayrı çalıştır" : (s.isProd && s.lock !== "acik") ? "prod salt okunur: önce yazma modunu aç" : "Ctrl+Enter";
  const tryTitle = s.mode === "Autocommit" ? "Autocommit script'i denenemez" : "Çalıştırır ve her zaman geri alır";
  return `<button class="primary" ${runDisabled?"disabled":""} title="${runTitle}">▶ Çalıştır</button>
          <button ${tryDisabled?"disabled":""} title="${tryTitle}">⟲ Dene</button>
          ${s.phase==="calisiyor" ? `<button class="danger">■ İptal</button>` : ""}`;
}
function historyLink() { return `<a href="#" title="Yapılandırma dizinindeki history/ klasörünü işletim sisteminin dosya yöneticisinde açar">Çalıştırma kayıtları klasörünü aç</a>`; }

function strips(s) {
  let h = "";
  if (s.mode === "Autocommit" && !["ac-bitti"].includes(s.phase)) h += `<div class="strip deneme">⚠ Autocommit: ${s.stmts.length} ifade anında kalıcı uygulanır, geri alınamaz.</div>`;
  if (s.isProd && s.deneme) h += `<div class="strip deneme">⚠ Deneme prod'da çalışır: satır kilitleri alır, sequence'ler ilerler (<span class="mono">nextval</span> geri alınmaz), tetikleyici/FDW/dblink dış etkileri geri alınmaz.</div>`;
  return h;
}

// karar çubuğu (commit/rollback) — tüm varyantlar kendi yerine koyar
function decision(s, style) {
  const p = s.phase;
  if (p === "karar" || p === "gerisayim" || p === "hata") {
    const cd = p === "gerisayim";
    const err = p === "hata";
    const msg = err
      ? `<b style="color:var(--err)">Satır ${ERR.line}'de hata — 2 ifade çalıştı, 1 çalıştırılmadı.</b> Transaction yalnızca geri alınabilir.`
      : `<b>4 ifade çalıştı.</b> Transaction açık, kilitler tutuluyor.`;
    const timer = cd ? `<span class="countdown count">⏱ 0:42 sonra otomatik rollback</span> <button>Uzat</button>`
                     : `<span class="dim count" title="Karar süresi: ${s.karar}; son 1 dakikada geri sayım görünür">Karar süresi ${s.karar}</span>`;
    const commitBtn = err ? "" : `<button class="primary">✔ Commit</button>`;
    return `<div class="decision ${style||""}">${msg} ${timer} <span style="flex:1"></span>${commitBtn} <button class="danger">↺ Rollback</button></div>`;
  }
  if (p === "suredoldu") return `<div class="decision done">Süre doldu; transaction geri alındı. <span class="dim">Log korunuyor.</span></div>`;
  if (p === "commit") return `<div class="decision done" style="color:var(--ok)">✔ Commit edildi · 4 ifade · 245 ms</div>`;
  if (p === "deneme") return `<div class="decision done" style="color:#f3c27a">⟲ Deneme bitti — tüm değişiklikler geri alındı. <span class="dim">+1 eklendi · ~1 284 güncellendi · −3 911 silindi</span></div>`;
  if (p === "deneme-hata") return `<div class="decision done" style="color:#ffb3b8">⟲ Deneme satır ${ERR.line}'de hata verdi (${ERR.code}); geri alındı.</div>`;
  if (p === "ac-bitti") return `<div class="decision done" style="color:#f3c27a">Autocommit: 1 ifade kalıcı uygulandı · 1 hatalı · 0 çalıştırılmadı</div>`;
  if (p === "karisik") return `<div class="decision done" style="color:#ffb3b8">Bu script transaction dışı komutlarla diğer ifadeleri karıştırıyor. İşaretli ifadeyi ayrı bir script'te çalıştır.</div>`;
  return "";
}

function stmtStatus(s, i) { return s.st[i] || null; }
function stmtDetail(s, i) {
  const x = s.stmts[i], st = stmtStatus(s, i);
  if (st === "ok") return `${x.rows} · ${x.ms} ms`;
  if (st === "run") return `çalışıyor… 3,2 sn`;
  if (st === "err") return s.script === "ac" ? `55000 · index "idx_oturum_musteri" already exists` : `${ERR.code} · ${ERR.msg}`;
  if (st === "skip") return "çalıştırılmadı";
  if (st === "wait") return "sırada";
  if (x.nontx) return "transaction dışı komut — ayrı çalıştırılmalı";
  return "";
}
function previewTable(rows) {
  return `<table class="p"><tr>${rows[0].map(c=>`<th>${c}</th>`).join("")}</tr>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table>`;
}
function logList(s, opts={}) {
  if (!s.st.length) return `<div class="dim" style="padding:12px">${s.mode==="Karışık" ? "Çalıştırılamaz." : "Henüz çalıştırılmadı."}</div>`;
  return `<div class="log">` + s.stmts.map((x, i) => {
    const st = stmtStatus(s, i);
    const cls = st === "err" ? "err" : st === "run" ? "cur" : st === "skip" || st === "wait" ? "skip" : "";
    let h = `<div class="row ${cls}" onclick="flash(${x.from})"><span>${ICON[st]||""}</span><span class="dim mono">:${x.from}</span><span class="mono">${x.tag}</span><span class="count dim">${st==="ok"?x.rows:""}</span><span class="count dim">${st==="ok"?x.ms+" ms":""}</span>`;
    if (st === "err") h += `<span class="msg">${stmtDetail(s,i)} — satır ${s.script==="ac"?2:ERR.line}${s.script==="ac"?"":", sütun "+ERR.col}</span>`;
    if (st === "ok" && x.preview && !opts.noPreview) h += `<div class="preview">${previewTable(x.preview)}</div>`;
    return h + `</div>`;
  }).join("") + `</div>`;
}
function changes(s) {
  return `<div style="padding:8px 12px">
    <div style="margin-bottom:4px"><b class="mono">musteri</b> <span class="dim">~1 284 güncellendi</span></div>
    <table class="p"><tr><th>id</th><th>ad</th><th>durum</th></tr>
      <tr><td>17</td><td>Ayşe K.</td><td class="chg"><s>aktif</s> pasif</td></tr>
      <tr><td>42</td><td>Mert Y.</td><td class="chg"><s>aktif</s> pasif</td></tr></table>
    <div class="dim">… 1 282 satır daha</div>
    <div style="margin:10px 0 4px"><b class="mono">denetim_notu</b> <span class="dim">+1 eklendi</span></div>
    <table class="p"><tr><th>id</th><th>tablo</th><th>not_metni</th></tr><tr class="add"><td>9001</td><td>musteri</td><td>eski hesaplar pasife alındı</td></tr></table>
    <div style="margin:10px 0 4px"><b class="mono">oturum</b> <span class="dim">−3 911 silindi</span></div>
    <table class="p"><tr><th>id</th><th>musteri_id</th></tr><tr class="del"><td>55120</td><td>17</td></tr></table>
  </div>`;
}

function editorLines(s, opts={}) {
  const errLine = s.phase.includes("hata") ? (s.script === "ac" ? 2 : ERR.line) : (s.phase === "ac-bitti" ? 2 : null);
  return s.lines.map((line, k) => {
    const n = k + 1, i = stmtOfLine(s, n), x = s.stmts[i], st = i >= 0 ? stmtStatus(s, i) : null;
    let cls = "ln";
    if (n === errLine) cls += " errline";
    if (st === "run") cls += " running";
    if (x && x.nontx && s.phase === "karisik") cls += " nontx";
    const gut = x && n === x.from ? (x.nontx && s.phase==="karisik" ? '<span style="color:var(--warn)">⚠</span>' : (ICON[st] || "")) : "";
    let h = `<div class="${cls}" data-n="${n}"><span class="g gi">${opts.gutter===false?"":gut}</span><span class="n">${n}</span><span class="c mono">${hl(line) || " "}</span></div>`;
    if (opts.inline && x && n === x.to && (st || x.nontx)) {
      const kind = st === "err" ? "e" : st === "ok" ? "o" : st === "run" ? "r" : x.nontx ? "w" : "";
      h += `<div class="inlinewidget ${kind}">${ICON[st]||"⚠"} ${stmtDetail(s, i)}${st==="ok"&&x.preview?previewTable(x.preview):""}${st==="ok"&&s.deneme&&x.tag!=="SELECT"?` <a href="#">farkı göster</a>`:""}</div>`;
    }
    return h;
  }).join("");
}

function modals(s) {
  return "";
}

// ---------- Varyant A: IDE — üst araç çubuğu, editör, alt panel (sekmeli), karar çubuğu panelin üstünde ----------
function VariantA(s) {
  const tabs = s.deneme ? ["Değişiklikler", "Çalıştırma logu"] : ["Çalıştırma logu"];
  const cur = tabs.includes(tab) ? tab : tabs[0];
  return `<div class="app ${s.isProd?"prod":""}">
    <div class="strip" style="background:var(--panel);border-bottom:1px solid var(--line);padding:6px 10px">
      ${targetSel(s)} ${lockCtl(s)} <span style="flex:1"></span> ${modeBadge(s)} ${runButtons(s)}
    </div>
    ${strips(s)}
    <div class="editor">${editorLines(s)}</div>
    <style>.decision{display:flex;gap:10px;align-items:center;padding:7px 12px;background:#2e3034;border-top:1px solid var(--line);border-bottom:1px solid var(--line)} .decision.done{background:var(--panel2)}</style>
    ${decision(s)}
    <div style="height:38%;display:flex;flex-direction:column;background:var(--panel2);border-top:1px solid var(--line)">
      <div class="tabs">${tabs.map(t=>`<div class="${t===cur?"on":""}" onclick="tab='${t}';render()">${t}</div>`).join("")}
        <span style="flex:1"></span><span style="padding:5px 8px;font-size:12px">${historyLink()}</span></div>
      <div style="flex:1;overflow:auto">${cur === "Değişiklikler" ? changes(s) : logList(s)}</div>
    </div>
  </div>`;
}

// ---------- Varyant B: sağ sütun zaman çizelgesi; karar kartı sütunun tepesinde; hedef sol üstte büyük başlık ----------
function VariantB(s) {
  const tabs = s.deneme ? ["Değişiklikler", "Log"] : ["Log"];
  const cur = tabs.includes(tab) ? tab : tabs[0];
  const timeline = !s.st.length ? `<div class="dim" style="padding:14px">${s.mode==="Karışık"?"Çalıştırılamaz.":"Henüz çalıştırılmadı."}</div>` :
    s.stmts.map((x, i) => {
      const st = stmtStatus(s, i);
      const bc = st==="ok"?"var(--ok)":st==="err"?"var(--err)":st==="run"?"var(--run)":"var(--line)";
      return `<div style="border-left:3px solid ${bc};margin:8px 12px;padding:4px 10px;background:${st==="err"?"#2e1a1d":"#26282c"};border-radius:0 4px 4px 0;cursor:pointer" onclick="flash(${x.from})">
        <div style="display:flex;gap:8px"><span>${ICON[st]||""}</span><b class="mono">${x.tag}</b><span class="dim mono">satır ${x.from}</span><span style="flex:1"></span><span class="dim count">${st==="ok"?x.ms+" ms":""}</span></div>
        <div class="dim" style="font-size:12px">${stmtDetail(s,i)}</div>
        ${st==="ok"&&x.preview?previewTable(x.preview):""}
      </div>`;
    }).join("");
  return `<div class="app ${s.isProd?"prod":""}">
    <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:${s.isProd?"#3a1d20":"var(--panel)"};border-bottom:1px solid var(--line)">
      <span class="dot" style="background:${s.t.color};width:12px;height:12px"></span>
      <div><div style="font-size:15px;font-weight:600">${s.t.conn} <span class="dim">/</span> ${s.t.db}</div><div class="dim" style="font-size:11.5px">hedefi değiştir ▾</div></div>
      <span class="badge env" style="background:${s.t.color}">${s.t.env}</span> ${lockCtl(s)}
      <span style="flex:1"></span>${historyLink()}
    </div>
    ${strips(s)}
    <div style="flex:1;display:flex;min-height:0">
      <div style="flex:1;display:flex;flex-direction:column;min-width:0">
        <div class="editor">${editorLines(s)}</div>
        <div style="display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--panel);border-top:1px solid var(--line)">${modeBadge(s)}<span style="flex:1"></span>${runButtons(s)}</div>
      </div>
      <div style="width:400px;border-left:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column">
        <style>.decision{margin:10px;padding:10px 12px;border-radius:6px;background:#2e3034;border:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center} .decision.done{background:none}</style>
        ${decision(s)}
        <div class="tabs">${tabs.map(t=>`<div class="${t===cur?"on":""}" onclick="tab='${t}';render()">${t}</div>`).join("")}</div>
        <div style="flex:1;overflow:auto">${cur === "Değişiklikler" ? changes(s) : timeline}</div>
      </div>
    </div>
  </div>`;
}

// ---------- Varyant C: satır içi — log editör içinde ifadelerin altına; karar alttaki büyük yapışkan çubuk ----------
function VariantC(s) {
  return `<div class="app ${s.isProd?"prod":""}">
    <div class="strip" style="background:var(--panel);border-bottom:1px solid var(--line)">
      ${targetSel(s)} ${modeBadge(s)} ${lockCtl(s)}<span style="flex:1"></span>${runButtons(s)}
    </div>
    ${strips(s)}
    <div class="editor">${editorLines(s, { inline:true })}</div>
    ${s.deneme ? `<details style="background:var(--panel2);border-top:1px solid var(--line);max-height:40%;overflow:auto"><summary style="padding:6px 12px;cursor:pointer">Değişiklikler: +1 eklendi · ~1 284 güncellendi · −3 911 silindi</summary>${changes(s)}</details>` : ""}
    <style>.decision{display:flex;gap:12px;align-items:center;padding:12px 16px;background:${s.isProd?"#3a1d20":"#24324a"};border-top:2px solid ${s.isProd?"var(--prod)":"#3574f0"};font-size:14px} .decision.done{background:var(--panel2);border-top:1px solid var(--line);font-size:13px} .decision button{padding:6px 16px}</style>
    ${decision(s)}
    <div style="padding:3px 12px;font-size:11.5px;background:var(--panel2);border-top:1px solid var(--line);display:flex"><span class="dim">${s.st.length?`${s.st.filter(x=>x==="ok").length}/${s.stmts.length} ifade`:""}</span><span style="flex:1"></span>${historyLink()}</div>
  </div>`;
}

// ---------- çizim ----------
function render() {
  const s = S();
  document.title = `Script ekranı — ${variant}`;
  document.getElementById("root").innerHTML = ({A:VariantA, B:VariantB, C:VariantC})[variant](s) + modals(s);
  const keys = Object.keys(VARIANTS);
  document.getElementById("sw").innerHTML = `
    <button onclick="cyc(-1)">←</button><b>${variant}</b> <span>(${VARIANTS[variant]})</span><button onclick="cyc(1)">→</button>
    <label>senaryo <select onchange="go(this.value)">${Object.entries(SCENARIOS).map(([k,v])=>`<option value="${k}" ${k===scenarioKey?"selected":""}>${v.label}</option>`).join("")}</select></label>
    <label>hedef <select onchange="hedef=this.value;setUrl();render()" ${S().forceProd?"disabled":""}><option ${hedef==="dev"?"selected":""}>dev</option><option ${hedef==="prod"?"selected":""}>prod</option></select></label>`;
}
function cyc(d) { const k = Object.keys(VARIANTS); variant = k[(k.indexOf(variant)+d+k.length)%k.length]; setUrl(); render(); }
function go(k) { scenarioKey = k; tab = null; setUrl(); render(); }
function flash(n) { const el = document.querySelector(`.ln[data-n="${n}"]`); if (el) { el.scrollIntoView({block:"center"}); el.style.outline="1px solid #6ea8fe"; setTimeout(()=>el.style.outline="",800); } }
addEventListener("keydown", e => {
  if (e.target.closest("input,textarea,select,[contenteditable]")) return;
  if (e.key === "ArrowLeft") cyc(-1); if (e.key === "ArrowRight") cyc(1);
});
setUrl(); render();
</script>
</body>
</html>
